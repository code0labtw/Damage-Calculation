<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>砲擊倍率計算</title>
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f4f5f7,#16181d);--card:light-dark(#fff,#21242b);--field:light-dark(#eceff4,#2f3542);
--text:light-dark(#1d2129,#e8eaed);--sub:light-dark(#6b7280,#9aa0aa);--line:light-dark(#d9dde3,#3d4453);
--accent:light-dark(#3b6fd4,#6c9bff);--res:light-dark(#eef3ff,#1b2437);
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:600}
button{border:1px solid var(--line);background:none;color:var(--text);border-radius:8px;font-size:14px;padding:8px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--sub)}
.row,.x{display:flex;align-items:center;gap:8px;margin-top:4px}
input,select{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text);outline:none}
select{width:90px;flex:none;background:light-dark(#dce6fa,#34415e);color:var(--accent);font-weight:600;border-color:var(--accent)}
#mults{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{background:var(--res);border-color:var(--accent)}
.big{font-size:28px;font-weight:700;color:var(--accent);word-break:break-all}
.small{font-size:13px;color:var(--sub);margin-top:4px}
.btns{display:flex;gap:8px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>砲擊倍率計算</h1><div class="btns"><button id="clear">全部清空</button><button id="theme">切換淺/深色</button></div></header>

<div class="card">
<h2>砲擊數字</h2>
<label>數值
<div class="row">
<input id="base" type="number" inputmode="decimal" step="any">
<select id="unit"><option value="1e8">億</option><option value="1e12">兆</option></select>
</div>
</label>
</div>

<div class="card">
<h2>砲擊後增加倍率（留空 = 不加成）</h2>
<div id="mults"></div>
</div>

<div class="card result">
<h2>計算結果</h2>
<div class="big" id="out">—</div>
<div class="small" id="mult"></div>
<div class="small" id="raw"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const names=['頭隊長技','尾隊長技','隊伍技','龍刻增傷','隊員 1 增傷','隊員 2 增傷','隊員 3 增傷','隊員 4 增傷'];
$('mults').innerHTML=names.map(n=>`<label>${n}<div class="x">×<input class="m" type="number" inputmode="decimal" step="any"></div></label>`).join('');
const ms=[...document.querySelectorAll('.m')];

const units=[[1e16,'京'],[1e12,'兆'],[1e8,'億']];
function fmt(v){
  const u=units.find(([n])=>v>=n);
  return u?+(v/u[0]).toPrecision(6)+' '+u[1]:v.toLocaleString('zh-TW',{maximumFractionDigits:2});
}
function calc(){
  const raw=parseFloat($('base').value);
  const mult=ms.reduce((m,i)=>m*(parseFloat(i.value)||1),1);
  $('mult').textContent='總倍率 ×'+(+mult.toPrecision(8));
  const ok=!isNaN(raw);
  const base=raw*$('unit').value;
  $('out').textContent=ok?fmt(base*mult):'—';
  $('raw').textContent=ok?'原始砲擊：'+fmt(base):'';
}
document.addEventListener('input',calc);
$('clear').onclick=()=>{document.querySelectorAll('input').forEach(i=>i.value='');calc();};
let dark=matchMedia('(prefers-color-scheme:dark)').matches;
$('theme').onclick=()=>document.documentElement.style.colorScheme=(dark=!dark)?'dark':'light';
calc();
</script>
</body>
</html>
